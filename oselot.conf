; OSELOT ground station configuration
; Parsed by Python configparser. Inline comments begin with ';' or '#'.
; All paths must be absolute on the target.

[goesproc]
output_dir = /data/goes/images   ; directory goesproc writes decoded jpg+json into
poll_interval_sec = 2            ; fallback polling interval (s) when inotify_simple is not installed

[irc]
; mode = eirc | stub
;   eirc - real eIRC TCP+packet client; connects directly to a Node room
;   stub - logs every send to the journal, no network. Useful for tests.
mode = eirc
server = 192.168.0.241           ; eIRC Node address (direct, bypasses the Tracker)
port = 6667                      ; eIRC Node TCP port
nick = oselot-goes               ; bot username; MUST start with "oselot" - the Node's
                                 ; node.cpp policy bounces [OSELOT]/[OSELOT-XFER] lines
                                 ; from any other nick with an ERROR packet
channel = (node)                 ; eIRC has no channel concept inside a Node;
                                 ; this value is passed through but ignored
reconnect_delay_sec = 10         ; backoff between reconnect attempts on disconnect

[transport]
; image_method controls how each decoded image is delivered to subscribers.
; Values:
;   irc_chunked - stream the file directly over the eIRC Node as base64
;                 chunks via the [OSELOT-XFER] protocol. Default. Works
;                 with no setup beyond the eIRC connection itself.
;   scp         - push the file to a known host via system scp; metadata
;                 line carries the remote path. Requires [scp] section
;                 to be filled in AND the watcher to be invoked with
;                 the -S / --scp command-line flag (the flag is the gate
;                 even if image_method=scp here, so accidental SCP
;                 attempts can't happen on a misconfigured run).
image_method = irc_chunked

[scp]
remote_host = 192.168.0.20       ; archive host (image collection target)
remote_user = oselot             ; ssh user on remote_host with write access to remote_path
remote_path = /data/goes/incoming ; absolute directory on remote_host; trailing slash optional
identity_file = /etc/oselot/id_ed25519 ; ssh private key used by scp -i; leave empty to use default keys

[irc_chunked]
chunk_size_bytes = 300           ; raw bytes per CHUNK before base64; 300 -> ~400-char body (safe < 450)
inter_chunk_delay_ms = 100       ; delay between CHUNK packets; the eIRC Node only unpacks one
                                 ; packet per recv(), so back-to-back sends without delay can
                                 ; coalesce on the wire and the second packet is dropped

[oselot]
satellite_id = GOES19            ; default satellite id used when sidecar JSON omits one
log_level = INFO                 ; DEBUG | INFO | WARNING | ERROR
log_file = /var/log/oselot.log   ; rotating file log (2 MB x 3); empty disables file logging
